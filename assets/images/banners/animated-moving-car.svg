<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700">
  <defs>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F1219"/>
      <stop offset="30%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#080A0E"/>
    </linearGradient>
    <linearGradient id="carBodyGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2D3344"/>
      <stop offset="40%" stop-color="#1E2330"/>
      <stop offset="80%" stop-color="#141822"/>
      <stop offset="100%" stop-color="#0D1017"/>
    </linearGradient>
    <linearGradient id="goldStreak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA820A"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#FFF2B2"/>
    </linearGradient>
    <linearGradient id="laserBeam" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="rgba(103, 232, 249, 0.7)"/>
      <stop offset="40%" stop-color="rgba(56, 189, 248, 0.3)"/>
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)"/>
    </linearGradient>
    <linearGradient id="neonUnder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(212, 175, 55, 0)"/>
      <stop offset="50%" stop-color="rgba(212, 175, 55, 0.5)"/>
      <stop offset="100%" stop-color="rgba(212, 175, 55, 0)"/>
    </linearGradient>
    <radialGradient id="wheelHub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="60%" stop-color="#1E2330"/>
      <stop offset="100%" stop-color="#0B0D12"/>
    </radialGradient>
  </defs>

  <!-- Background Ambience -->
  <rect width="1600" height="700" fill="url(#roadGrad)"/>

  <!-- Moving Speed Lines (Atmosphere) -->
  <g opacity="0.6">
    <!-- Fast light streak 1 -->
    <line x1="1800" y1="180" x2="2100" y2="180" stroke="#38BDF8" stroke-width="2" stroke-linecap="round">
      <animate attributeName="x1" from="1800" to="-400" dur="1.1s" repeatCount="indefinite" />
      <animate attributeName="x2" from="2100" to="-100" dur="1.1s" repeatCount="indefinite" />
    </line>
    <!-- Fast light streak 2 -->
    <line x1="1900" y1="240" x2="2350" y2="240" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="x1" from="1900" to="-500" dur="0.85s" repeatCount="indefinite" />
      <animate attributeName="x2" from="2350" to="-50" dur="0.85s" repeatCount="indefinite" />
    </line>
    <!-- Fast light streak 3 -->
    <line x1="1700" y1="300" x2="2000" y2="300" stroke="#A855F7" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="x1" from="1700" to="-400" dur="1.3s" repeatCount="indefinite" />
      <animate attributeName="x2" from="2000" to="-100" dur="1.3s" repeatCount="indefinite" />
    </line>
    <!-- Fast light streak 4 -->
    <line x1="2000" y1="140" x2="2400" y2="140" stroke="#38BDF8" stroke-width="2" stroke-linecap="round">
      <animate attributeName="x1" from="2000" to="-500" dur="0.95s" repeatCount="indefinite" />
      <animate attributeName="x2" from="2400" to="-100" dur="0.95s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Asphalt Road & Moving Dashed Highway Markings -->
  <line x1="0" y1="470" x2="1600" y2="470" stroke="#1F2636" stroke-width="3"/>
  <line x1="0" y1="580" x2="1600" y2="580" stroke="#161B26" stroke-width="2"/>
  
  <!-- Animated Moving Dashed Center Line on Highway -->
  <g stroke="#D4AF37" stroke-width="5" stroke-linecap="round" opacity="0.75">
    <line x1="1700" y1="520" x2="1820" y2="520">
      <animate attributeName="x1" from="1700" to="-200" dur="0.55s" repeatCount="indefinite" />
      <animate attributeName="x2" from="1820" to="-80" dur="0.55s" repeatCount="indefinite" />
    </line>
    <line x1="1300" y1="520" x2="1420" y2="520">
      <animate attributeName="x1" from="1300" to="-600" dur="0.55s" repeatCount="indefinite" />
      <animate attributeName="x2" from="1420" to="-480" dur="0.55s" repeatCount="indefinite" />
    </line>
    <line x1="900" y1="520" x2="1020" y2="520">
      <animate attributeName="x1" from="900" to="-1000" dur="0.55s" repeatCount="indefinite" />
      <animate attributeName="x2" from="1020" to="-880" dur="0.55s" repeatCount="indefinite" />
    </line>
    <line x1="500" y1="520" x2="620" y2="520">
      <animate attributeName="x1" from="500" to="-1400" dur="0.55s" repeatCount="indefinite" />
      <animate attributeName="x2" from="620" to="-1280" dur="0.55s" repeatCount="indefinite" />
    </line>
    <line x1="100" y1="520" x2="220" y2="520">
      <animate attributeName="x1" from="100" to="-1800" dur="0.55s" repeatCount="indefinite" />
      <animate attributeName="x2" from="220" to="-1680" dur="0.55s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Car Group with Suspension Dynamics Animation -->
  <g transform="translate(380, 50)">
    <animateTransform attributeName="transform" type="translate" 
      values="380,50; 380,48; 380,51; 380,49; 380,50" 
      dur="1.2s" repeatCount="indefinite" />

    <!-- Headlight Laser Beam Projecting Ahead -->
    <polygon points="120,335 -380,240 -380,440 120,360" fill="url(#laserBeam)" />
    <!-- Ground Illumination Cone -->
    <ellipse cx="60" cy="385" rx="160" ry="25" fill="rgba(56, 189, 248, 0.15)"/>
    
    <!-- Golden Neon Underglow -->
    <ellipse cx="450" cy="405" rx="360" ry="22" fill="url(#neonUnder)"/>

    <!-- Car Silhouette & Aerodynamics (Low Slung Luxury Sports GT) -->
    <!-- Windows & Cabin -->
    <path d="M260,285 C310,200 420,170 560,170 C660,170 720,225 790,285 Z" fill="#151A24" stroke="#333C4E" stroke-width="2.5"/>
    <path d="M300,280 C345,210 430,185 550,185 C640,185 690,225 750,280 Z" fill="#202738" opacity="0.9"/>
    <!-- Pillar Divider -->
    <line x1="530" y1="185" x2="520" y2="280" stroke="#0D1017" stroke-width="4"/>

    <!-- Main Body Work -->
    <path d="M80,345 C95,310 150,300 240,290 C340,280 460,270 600,270 C720,270 790,290 840,320 C870,340 860,375 825,385 C795,340 730,340 700,385 L350,385 C320,340 255,340 225,385 C160,385 110,380 80,360 Z" 
          fill="url(#carBodyGrad)" stroke="#475569" stroke-width="2.5"/>

    <!-- Gold Accent Character Line -->
    <path d="M95,335 C230,310 520,290 820,325" fill="none" stroke="url(#goldStreak)" stroke-width="3" stroke-linecap="round"/>

    <!-- Front Bumper Air Intake & Headlight Cluster -->
    <polygon points="90,345 135,335 125,355" fill="#67E8F9" filter="drop-shadow(0 0 10px #38BDF8)"/>
    <!-- Rear Taillight Cluster (Striking Red Blade) -->
    <path d="M835,325 L855,335 L840,345 Z" fill="#EF4444" filter="drop-shadow(0 0 10px #EF4444)"/>

    <!-- Front High-Performance Wheel (Spinning Spokes Animation) -->
    <g transform="translate(290, 385)">
      <!-- Tire -->
      <circle cx="0" cy="0" r="54" fill="#0A0D12" stroke="#334155" stroke-width="5"/>
      <circle cx="0" cy="0" r="42" fill="#131722" stroke="url(#goldStreak)" stroke-width="2"/>
      <!-- Spinning Alloy Rim Spokes -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="0.25s" repeatCount="indefinite" />
        <line x1="0" y1="-38" x2="0" y2="38" stroke="#D4AF37" stroke-width="3"/>
        <line x1="-38" y1="0" x2="38" y2="0" stroke="#D4AF37" stroke-width="3"/>
        <line x1="-27" y1="-27" x2="27" y2="27" stroke="#CBD5E1" stroke-width="2"/>
        <line x1="-27" y1="27" x2="27" y2="-27" stroke="#CBD5E1" stroke-width="2"/>
        <circle cx="0" cy="0" r="14" fill="url(#wheelHub)"/>
      </g>
    </g>

    <!-- Rear High-Performance Wheel (Spinning Spokes Animation) -->
    <g transform="translate(745, 385)">
      <!-- Tire -->
      <circle cx="0" cy="0" r="54" fill="#0A0D12" stroke="#334155" stroke-width="5"/>
      <circle cx="0" cy="0" r="42" fill="#131722" stroke="url(#goldStreak)" stroke-width="2"/>
      <!-- Spinning Alloy Rim Spokes -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="0.25s" repeatCount="indefinite" />
        <line x1="0" y1="-38" x2="0" y2="38" stroke="#D4AF37" stroke-width="3"/>
        <line x1="-38" y1="0" x2="38" y2="0" stroke="#D4AF37" stroke-width="3"/>
        <line x1="-27" y1="-27" x2="27" y2="27" stroke="#CBD5E1" stroke-width="2"/>
        <line x1="-27" y1="27" x2="27" y2="-27" stroke="#CBD5E1" stroke-width="2"/>
        <circle cx="0" cy="0" r="14" fill="url(#wheelHub)"/>
      </g>
    </g>

  </g>
</svg>