<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141720"/>
      <stop offset="60%" stop-color="#1F2432"/>
      <stop offset="100%" stop-color="#0E1017"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3344"/>
      <stop offset="40%" stop-color="#191D26"/>
      <stop offset="100%" stop-color="#0A0B0E"/>
    </linearGradient>
    <linearGradient id="goldS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA820A"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#F3E7C4"/>
    </linearGradient>
  </defs>
  <!-- Background Studio / Showroom Wall -->
  <rect width="1200" height="500" fill="url(#wallGrad)"/>
  <!-- Polished Marble Showroom Floor -->
  <rect y="500" width="1200" height="300" fill="url(#floorGrad)"/>
  
  <!-- Architectural Ceiling LED Light Bars -->
  <rect x="200" y="40" width="800" height="8" rx="4" fill="#FFFFFF" opacity="0.8"/>
  <rect x="300" y="80" width="600" height="6" rx="3" fill="#E2E8F0" opacity="0.6"/>
  <rect x="150" y="140" width="900" height="4" rx="2" fill="#D4AF37" opacity="0.4"/>
  
  <!-- Modern Showroom Glass Partition Lines -->
  <line x1="400" y1="0" x2="400" y2="500" stroke="#2B3142" stroke-width="2"/>
  <line x1="800" y1="0" x2="800" y2="500" stroke="#2B3142" stroke-width="2"/>

  <!-- Mamun Autos Showroom Neon Sign on Wall -->
  <rect x="450" y="170" width="300" height="90" rx="12" fill="#0D0E13" stroke="url(#goldS)" stroke-width="2"/>
  <text x="600" y="215" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="800" font-size="22" letter-spacing="4" text-anchor="middle">MAMUN <tspan fill="url(#goldS)">AUTOS</tspan></text>
  <text x="600" y="240" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="9" letter-spacing="3" text-anchor="middle">FLAGSHIP LUXURY SHOWROOM</text>

  <!-- Turntable Display Platform -->
  <ellipse cx="600" cy="620" rx="400" ry="80" fill="#171A24" stroke="url(#goldS)" stroke-width="2.5"/>
  <ellipse cx="600" cy="620" rx="370" ry="70" fill="#10131B"/>
  
  <!-- Center Luxury Car Profile -->
  <path d="M420,580 C440,530 500,500 600,500 C700,500 740,530 780,580 Z" fill="#1C212D" stroke="#3E475A" stroke-width="2"/>
  <path d="M350,610 C380,570 450,560 600,560 C750,560 820,570 850,610 Z" fill="#252C3C" stroke="#4A5568" stroke-width="2"/>
  <ellipse cx="430" cy="625" rx="36" ry="24" fill="#0E1015" stroke="url(#goldS)" stroke-width="2"/>
  <ellipse cx="770" cy="625" rx="36" ry="24" fill="#0E1015" stroke="url(#goldS)" stroke-width="2"/>
  
  <!-- Showroom Reflection on Floor -->
  <text x="600" y="740" fill="#4B5563" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" letter-spacing="4" text-anchor="middle">EXPERIENCE UNPARALLELED LUXURY</text>
</svg>